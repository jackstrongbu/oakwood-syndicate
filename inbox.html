<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Syndicate Inbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f4;--paper:#fff;--ink:#14202e;--muted:#5d6b7a;--rule:#d5dce3;--accent:#1d4ed8;--accent-ink:#fff;--down:#e04a3a;--up:#2fae4a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--paper:#17212d;--ink:#e7edf3;--muted:#93a2b2;--rule:#2a3746;--accent:#7aa2ff;--accent-ink:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1620;--paper:#17212d;--ink:#e7edf3;--muted:#93a2b2;--rule:#2a3746;--accent:#7aa2ff;--accent-ink:#0b1220;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:2.2rem;margin:0}
a{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px;min-width:0;flex:1 1 200px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.del{background:transparent;color:var(--down);border-color:var(--down)}
.msg{color:var(--muted);min-height:1.2em}.msg.err{color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;height:260px;object-fit:cover;object-position:top;background:var(--bg);display:block}
.item .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.item .who{font-family:var(--display);font-weight:700;font-size:1.15rem}
.item .when,.item .note{font-size:.8rem;color:var(--muted)}
.item .acts{display:flex;gap:6px;padding:0 10px 10px}
.item .acts a,.item .acts button{font-size:.8rem;padding:5px 10px}
.item .acts a{border:1px solid var(--accent);border-radius:6px;text-decoration:none;font-weight:600}
</style></head><body>
<div class="wrap">
  <div><h1>Syndicate inbox</h1><p class="msg">Screenshots sent in from the site. Open one, save it, and send it to Claude (or drop it in the tracker's Matchday desk). <a href="/">Back to the site</a></p></div>
  <form class="bar" id="f"><input type="password" id="k" placeholder="Inbox key" autocomplete="current-password" aria-label="Inbox key"><button>Open</button><button type="button" class="ghost" id="forget">Forget key</button></form>
  <div class="msg" id="m" role="status"></div>
  <div class="grid" id="g"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let key="";try{key=localStorage.getItem("oak-inbox")||""}catch{}
$("k").value=key;
const msg=(t,e)=>{$("m").textContent=t;$("m").className="msg"+(e?" err":"")};
async function load(){
  if(!key)return;
  msg("Loading…");
  const r=await fetch("/api/inbox?key="+encodeURIComponent(key)).catch(()=>null);
  if(!r||!r.ok){msg(r&&r.status===401?"That key isn't right":"Couldn't reach the inbox",true);$("g").innerHTML="";return}
  try{localStorage.setItem("oak-inbox",key)}catch{}
  const {items}=await r.json();
  msg(items.length?`${items.length} screenshot${items.length>1?"s":""}, newest first`:"Inbox is empty");
  const src=id=>"/api/inbox?key="+encodeURIComponent(key)+"&id="+encodeURIComponent(id);
  $("g").innerHTML=items.map(i=>`<div class="item" data-id="${esc(i.id)}"><a href="${src(i.id)}" target="_blank" rel="noopener"><img loading="lazy" alt="Screenshot from ${esc(i.who)}" src="${src(i.id)}"></a><div class="meta"><span class="who">${esc(i.who)}</span><span class="when">${esc(new Date(i.at).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>${i.note?`<span class="note">${esc(i.note)}</span>`:""}</div><div class="acts"><a href="${src(i.id)}" download="${esc(i.id)}">Save</a><button class="del">Delete</button></div></div>`).join("");
}
$("f").addEventListener("submit",e=>{e.preventDefault();key=$("k").value.trim();load()});
$("forget").addEventListener("click",()=>{try{localStorage.removeItem("oak-inbox")}catch{}key="";$("k").value="";$("g").innerHTML="";msg("")});
$("g").addEventListener("click",async e=>{
  const b=e.target.closest(".del");if(!b)return;
  const it=b.closest(".item");if(!confirm("Delete this screenshot?"))return;
  const r=await fetch("/api/inbox?key="+encodeURIComponent(key)+"&id="+encodeURIComponent(it.dataset.id)+"&action=delete",{method:"POST"});
  if(r.ok)it.remove();else msg("Couldn't delete it",true);
});
load();
</script>
</body></html>
